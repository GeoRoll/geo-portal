<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% if page.schema %}<script type="application/ld+json">
{{ page.schema }}
</script>{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1422;--navy2:#13223A;--ivory:#FAF6F0;--ink:#1B2433;--muted:#4A5868;--peach:#F2B48C;--peach-soft:#FFE9DA;--blue:#BFE0F7;--line:#E3DDD3}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:17px/1.65 Inter,system-ui,sans-serif}
a{color:#9A4F22}a:hover{color:#6E3410}
.top{background:var(--navy);padding:18px 16px}
.top .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;color:var(--ivory);text-decoration:none;letter-spacing:.02em}
.brand:hover{color:var(--peach-soft)}
.brand{display:inline-flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;display:block}
.top nav a{color:var(--blue);text-decoration:none;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
main{padding:48px 0 72px}
h1,h2,h3{font-family:"Cormorant Garamond",serif;color:var(--navy);line-height:1.15}
h1{font-size:46px;margin:0 0 18px}
h2{font-size:32px;margin:44px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
h3{font-size:23px;margin:26px 0 6px}
.hero{background:var(--navy);color:var(--ivory);border-radius:20px;padding:48px 32px;margin-bottom:40px}
.hero h1{color:var(--ivory)}
.hero p{color:#D5DEE9;max-width:620px;margin:0}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--peach);margin:0 0 10px}
.cards{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.cards a{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;text-decoration:none;color:var(--ink)}
.cards a:hover{border-color:var(--peach)}
.cards strong{display:block;font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--navy)}
.cards span{color:var(--muted);font-size:15px}
.empty{color:var(--muted)}
.btn{display:inline-block;background:var(--peach);color:var(--navy);font-weight:600;padding:13px 22px;border-radius:10px;text-decoration:none}
.btn:hover{background:var(--peach-soft);color:var(--navy)}
.top nav{display:flex;gap:20px;align-items:center}
.top nav a{white-space:nowrap}
.top nav a.cta{color:var(--navy);background:var(--peach);padding:7px 14px;border-radius:8px;font-weight:600}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px}
.hero-logo{display:block;width:100%;height:auto;max-width:520px;margin:4px auto 22px}
.hero.landing{text-align:center;padding:40px 28px 48px}
.hero.landing h1{font-size:44px;max-width:680px;margin:6px auto 16px}
.hero.landing p{margin:0 auto}
.btn-row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:26px}
.fine{font-size:14px;color:#AFC0D3}
.watch{text-align:center;margin:8px 0 40px}
.watch-lbl{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--navy);margin:0 0 14px}
.watch video{display:block;width:100%;max-width:340px;height:auto;aspect-ratio:9/16;margin:0 auto;border-radius:18px;background:var(--navy);box-shadow:0 18px 50px rgba(10,20,34,.18)}
.player{position:relative;width:100%;max-width:340px;margin:0 auto}
.player video{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h3{margin:0 0 6px;font-size:22px}
.card p{margin:0;color:var(--muted);font-size:15px}
.steps{counter-reset:s;list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.steps li{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px 18px 70px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:22px;top:18px;width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--ivory);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.steps strong{display:block;color:var(--navy)}
.steps span{color:var(--muted);font-size:15px}
.note{background:var(--peach-soft);border-radius:14px;padding:18px 22px;margin-top:18px;color:var(--ink)}
.cta-band{background:var(--navy);color:var(--ivory);border-radius:20px;padding:36px 28px;text-align:center;margin-top:44px}
.cta-band h2{color:var(--ivory);border:0;margin:0 0 8px;padding:0}
.cta-band p{color:#D5DEE9;margin:0}
body.stars{background:var(--navy)}
body.stars::before{content:"";position:fixed;inset:0;z-index:-1;background:url("{{ '/assets/georoll-page-bg.jpg' | relative_url }}") center/cover no-repeat}
body.home .hero,body.home .cta-band{box-shadow:0 0 0 1px rgba(191,224,247,.18),0 20px 60px rgba(0,0,0,.45)}
body.home h2{color:var(--ivory);border-top-color:rgba(255,255,255,.14)}
body.home .watch-lbl{color:var(--ivory)}
body.home .watch video{box-shadow:0 18px 50px rgba(0,0,0,.5)}
body.home .empty{color:#D5DEE9}
body.stars footer{color:#AFC0D3;border-top-color:rgba(255,255,255,.14)}
body.stars footer a{color:var(--peach)}
.terms-head,.page-head{background:var(--navy);color:var(--ivory);border-radius:20px;padding:36px 32px;margin-bottom:22px;box-shadow:0 0 0 1px rgba(191,224,247,.18),0 20px 60px rgba(0,0,0,.45)}
.terms-head h1,.page-head h1{color:var(--ivory);margin:0 0 8px}
.terms-head p,.page-head p{color:#D5DEE9;margin:0 0 6px}
.page-head a{color:var(--peach)}
.page-head strong{color:var(--ivory)}
.terms-head p em{color:#AFC0D3;font-size:15px}
body.terms main .wrap{counter-reset:sec}
.panel{counter-increment:sec;background:#fff;border:1px solid var(--line);border-top:4px solid var(--peach);border-radius:16px;padding:24px 28px 20px;margin:0 0 18px;box-shadow:0 12px 36px rgba(0,0,0,.35)}
.panel h2{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:0 0 12px;border-top:0;border-bottom:1px solid var(--line);font-size:28px}
.panel h2::before{content:counter(sec);flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--ivory);font:600 15px/32px Inter,system-ui,sans-serif;text-align:center}
.panel p,.panel ul{margin:0 0 12px}
.panel ul{padding-left:20px}
.panel li{margin-bottom:8px}
.panel li::marker{color:var(--peach)}
body.client .panel h2::before,body.home .panel h2::before{display:none}
.panel h3{font-size:21px;margin:18px 0 4px}
.panel h3:first-of-type{margin-top:4px}
.page-note{color:#AFC0D3;font-size:14px;text-align:center;margin:8px 0 0}
.page-note em{font-style:normal}
.panel.companies h2{color:var(--navy);border-bottom:1px solid var(--line)}
body.home .panel.companies{margin-top:44px}
body.home .panel .empty{color:var(--muted);margin:0}
body.home .panel.companies .cards a{border-color:var(--line);box-shadow:none}
@media (max-width:600px){.panel{padding:20px 18px 14px}.panel h2{font-size:24px}.terms-head{padding:28px 20px}}
@media (max-width:600px){h1{font-size:36px}.hero{padding:32px 20px}.hero.landing h1{font-size:32px}.grid{grid-template-columns:1fr}.top nav a:not(.cta){display:none}}
</style>
</head>
<body{% if page.url == "/" %} class="home stars"{% elsif page.url == "/terms/" %} class="terms stars"{% elsif page.client %} class="client stars"{% endif %}>
<header class="top"><div class="wrap">
<a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/georoll-icon.png' | relative_url }}" alt="" width="34" height="34">GeoRoll</a>
<nav><a href="{{ '/' | relative_url }}#how-it-works">How it works</a><a href="{{ '/' | relative_url }}#companies">Companies</a>{% if site.checkout_url %}<a class="cta" href="{{ site.checkout_url }}">Get started</a>{% endif %}</nav>
</div></header>
<main><div class="wrap">
{{ content }}
</div></main>
<footer><div class="wrap">© {{ site.time | date: "%Y" }} GeoRoll · Company profiles written to be clear for people and AI search. · <a href="{{ '/terms/' | relative_url }}">Terms</a></div></footer>
</body>
</html>
